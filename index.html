<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Episode 2: Attribute Binding and Basic Events</title>
    <script src="https://unpkg.com/vue@3"></script>
    
    <style>
        html, body {
            height: 100%;
        }

        body {
            display: grid;
            place-items: center;
        }

        .text-red {
            color: red;
        }

        .text-green {
            color: green;
        }
    </style>
</head>

<body>
    <div id="app">

        <!-- :class (can use v-bind:class instead) evaluates to whatever the expression resolves to -->
         <!-- given expression becomes active (is the button true/ false. default to red if turned on and green for off) -->
        <!-- can use v-on:click instead of @click -->
         <button
            :class="active ? 'text-red' : 'text-green'"
            @click="toggle"
        >Click Me</button>
    </div>

    <script>
        Vue.createApp({
            data() {
                return {
                    active: false
                };
            },

            methods: {
                toggle() {
                    // if it's true then make it false, if it's false then make it true
                    // - acts as on/ off switch
                    this.active = ! this.active;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
